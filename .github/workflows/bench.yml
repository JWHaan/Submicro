name: bench
on:
  workflow_dispatch:
    inputs:
      base:
        description: Baseline commit SHA; this checkout is the candidate
        required: true
      events:
        description: Events in the dataset
        default: "20000000"
      runs:
        description: Timed runs of each side (interleaved)
        default: "7"
      codecs:
        description: Include the uncompressed writer as a third timed arm
        type: boolean
        default: false
      profile:
        description: Skip the A/B; perf-profile this checkout instead
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    if: ${{ !inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ inputs.base }}
      EVENTS: ${{ inputs.events }}
      RUNS: ${{ inputs.runs }}
      CODECS: ${{ inputs.codecs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inputs and public kit
        run: |
          LAB="$RUNNER_TEMP/submicro-bench"
          echo "LAB=$LAB" >> "$GITHUB_ENV"
          [[ "$BASE" =~ ^[a-f0-9]{7,40}$ && "$EVENTS" =~ ^(20000000|60000000)$ && "$RUNS" =~ ^[1-9]$ ]]
          git worktree add --detach "$RUNNER_TEMP/base" "$(git rev-parse --verify "$BASE^{commit}")"
          mkdir "$LAB"
          cd "$LAB"
          for kit in generator starter-duckdb dev-answer; do
            curl --retry 3 -fsSLo "$kit.zip" "https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/$kit.zip"
          done
          sha256sum -c <<'SUMS'
          78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip
          c2439e0e2e7456d721852814e9928e077648803d5c57a1760a40c7d3b0864d20  dev-answer.zip
          b84ff8726c43749043c33c250548a9ac9987b9132d28ac818a47515bd128f77c  starter-duckdb.zip
          SUMS
          for kit in generator starter-duckdb dev-answer; do unzip -q "$kit.zip"; done
          cargo build --offline --release --manifest-path generator/Cargo.toml
          python3 -m venv env
          env/bin/pip install polars==2.1.0
          chmod +x starter-duckdb/scripts/docker_run.sh
          lscpu | grep -E 'Model name|^CPU\(s\)|L3'
          echo "CPUS=$(nproc)" >> "$GITHUB_ENV"
      - name: Build the scoring images
        run: |
          cargo test --locked --bin shopping-sessions
          docker build --platform linux/amd64 -t bench-base "$RUNNER_TEMP/base"
          docker build --platform linux/amd64 -t bench-head .
          docker image inspect --format '{{.RepoTags}} {{.Architecture}} {{.Size}} bytes' bench-base bench-head
      - name: Check candidate image against fixture and dev answers
        run: |
          cd "$LAB"
          export IMAGE=bench-head MEM=12g
          sudo env IMAGE=bench-head MEM=12g CPUS="$CPUS" env/bin/python starter-duckdb/scripts/run_fixtures.py starter-duckdb/fixtures -- starter-duckdb/scripts/docker_run.sh
          generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output dev
          starter-duckdb/scripts/docker_run.sh dev dev-out > dev.stdout
          test ! -s dev.stdout
          env/bin/python starter-duckdb/scripts/compare.py dev-out dev-answer
          sudo rm -rf dev-out
      - name: Generate practice or final-size input
        run: |
          cd "$LAB"
          generator/target/release/generate --seed "$((EVENTS/1000+17))" --events "$EVENTS" --clicks "$((EVENTS/4))" --output data
          du -sh data; df -h .
      - name: Interleave full container runs and compare decoded tables
        run: python3 .github/bench.py

  profile:
    if: ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      EVENTS: ${{ inputs.events }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools, kit and data
        run: |
          [[ "$EVENTS" =~ ^[0-9]{7,8}$ ]]
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" >/dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-azure >/dev/null
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          lscpu | grep -E 'Model name|^CPU\(s\)|L2|L3'
          curl --retry 3 -fsSLo generator.zip https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo "78f973f75d14b48e792628284f19c75de71fa597d20952e16a9ced93c78bee4a  generator.zip" | sha256sum -c
          unzip -q generator.zip -d "$RUNNER_TEMP/kit"
          cargo build --offline --release --manifest-path "$RUNNER_TEMP/kit/generator/Cargo.toml"
          "$RUNNER_TEMP/kit/generator/target/release/generate" --seed "$((EVENTS/1000+17))" \
            --events "$EVENTS" --clicks "$((EVENTS/4))" --output "$RUNNER_TEMP/data"
      - name: Build with symbols
        run: |
          CARGO_PROFILE_RELEASE_DEBUG=line-tables-only CARGO_PROFILE_RELEASE_STRIP=none \
          RUSTFLAGS="-C target-cpu=x86-64-v3 -C force-frame-pointers=yes" \
            cargo build --release --locked --bin shopping-sessions
      - name: Phases, counters and hot symbols
        run: |
          B=target/release/shopping-sessions
          run() { rm -rf "$RUNNER_TEMP/out"; mkdir "$RUNNER_TEMP/out"; DATA_DIR="$RUNNER_TEMP/data" OUTPUT_DIR="$RUNNER_TEMP/out" NCPU=$(nproc) "$@"; }
          run $B; run $B   # warm the page cache
          for i in 1 2 3; do run env PHASE_TIMING=1 /usr/bin/time -f 'wall %e s user %U sys %S maxrss %M KB' $B; echo; done
          run perf stat -e task-clock,cycles,instructions,cache-misses,LLC-load-misses,dTLB-load-misses,page-faults $B 2>&1 | tail -20
          run perf record -F 2999 -g -o perf.data $B 2>/dev/null
          echo "===== flat (self time) ====="
          perf report -i perf.data --no-children --sort symbol --stdio 2>/dev/null | grep -v '^#' | grep -E '^ +[0-9]' | head -45
          echo "===== inclusive ====="
          perf report -i perf.data --children --sort symbol --stdio 2>/dev/null | grep -v '^#' | grep -E '^ +[0-9]' | head -30
